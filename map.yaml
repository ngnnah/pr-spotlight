# Technology terms mapped to pop-culture and history picture ideas. Add your own stack's terms.
# match: lowercase substrings to look for in changed file paths, diff text, PR title/body.
# refs: picture ideas (kind, work-safe). lesson_hint: one line for the caption writer.
# The Airflow entry is the generic fallback: put it last when ranking matches.

- term: DuckDB
  match:
  - duckdb
  refs:
  - The Godfather, cast as ducks in a pond-side family meeting
  - a duck pond library where every duck carries a parquet tile
  - Donald Duck as a lab chemist weighing tiny tables on a scale
  - a duck-shaped steam engine pulling a train of data columns
  lesson_hint: in-process analytics; great for local files, mind memory on big joins and the version of the file format
- term: dbt
  match:
  - dbt
  refs:
  - a Roman aqueduct where each arch is a model feeding the next
  - Hogwarts potions class, each cauldron a model with a recipe card
  - an assembly line in Charlie Chaplin's Modern Times, tidy and well labeled
  - Lego bricks snapping into layers from staging to marts
  lesson_hint: models are layered and tested; keep transforms small, named, and covered by tests
- term: Redshift
  match:
